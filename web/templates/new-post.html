{{define "title"}}New Post · Forum{{end}}

{{define "content"}}
<section class="form-card">
  <h1>Create a new post</h1>
  <p class="form-hint">Share an idea, ask a question or show off your latest build.</p>

  <form id="new-post-form" novalidate>
    <div class="form-group">
      <label for="post-title">Title</label>
      <input type="text" id="post-title" name="title" required maxlength="200" placeholder="Give your post a clear title">
    </div>

    <div class="form-group">
      <label for="post-body">Body</label>
      <textarea id="post-body" name="body" rows="8" required placeholder="Write the details of your post…"></textarea>
    </div>

    <div class="form-group">
      <label>Categories <small>(choose at least one — you can pick several)</small></label>
      <div class="category-checklist" id="category-checklist">
        {{range .Categories}}
          <label class="category-check">
            <input type="checkbox" name="categories" value="{{.Name}}">
            <span>{{.Name}}</span>
          </label>
        {{end}}
      </div>
    </div>

    <p id="new-post-error" class="form-error" role="alert" hidden></p>
    <button type="submit" class="btn btn-primary btn-block">Publish post</button>
  </form>
</section>
{{end}}
