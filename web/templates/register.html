{{define "title"}}Register · Forum{{end}}

{{define "content"}}
<section class="form-card auth-card">
  <h1>Create an account</h1>
  <form id="register-form">
    <div class="form-group">
      <label for="register-email">Email</label>
      <input type="email" id="register-email" name="email" required>
    </div>
    <div class="form-group">
      <label for="register-username">Username</label>
      <input type="text" id="register-username" name="username" required>
    </div>
    <div class="form-group">
      <label for="register-password">Password <small>(min 8 characters)</small></label>
      <input type="password" id="register-password" name="password" required minlength="8">
    </div>
    <p class="form-error" hidden></p>
    <button type="submit" class="btn btn-primary">Register</button>
  </form>
  <p class="auth-alt">Already have an account? <a href="/login">Log in</a></p>
</section>
{{end}}
