{{define "title"}}Log in · Forum{{end}}

{{define "content"}}
<section class="form-card auth-card">
  <h1>Welcome back</h1>
  <p class="form-hint">Log in to post, comment and react.</p>

  <form id="login-form" novalidate>
    <div class="form-group">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" name="email" required autocomplete="email" placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" name="password" required autocomplete="current-password" placeholder="••••••••">
    </div>
    <p class="form-error" role="alert" hidden></p>
    <button type="submit" class="btn btn-primary btn-block">Log in</button>
  </form>
  <p class="auth-alt">No account yet? <a href="/register">Register</a></p>
</section>
{{end}}
